version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ../poster_generators:/app/poster_generators
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgedelivery.settings.local
      DATABASE_URL: postgres://postgres:postgres@db:5432/edgedelivery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A edgedelivery worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
      - ../poster_generators:/app/poster_generators
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgedelivery.settings.local
      DATABASE_URL: postgres://postgres:postgres@db:5432/edgedelivery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: edgedelivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

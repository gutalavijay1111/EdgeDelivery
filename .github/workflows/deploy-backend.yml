name: Deploy Backend

# ─────────────────────────────────────────────────────────────────────────────
# Smart deploy: only runs the steps that the diff actually requires.
#
#   • migrations  → only when backend/apps/*/migrations/*.py changed
#   • celery      → only when tasks.py, poster_generators/, or content
#                   migrations changed (celery writes to the Content model)
#   • web         → always (this workflow only fires on backend changes)
#
# Docker layers are cached in GitHub Actions cache, so an unchanged
# requirements.txt won't re-pip-install on every push.
#
# Required GitHub Actions Variables (Settings → Variables):
#   AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER
#   ECS_SERVICE_WEB, ECS_SERVICE_CELERY
#   ECS_TASK_DEFINITION_WEB, ECS_TASK_DEFINITION_CELERY
#   CONTAINER_NAME
#
# Required Secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "poster_generators/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      force_migrate:
        description: "Force DB migrations (even without migration file changes)"
        type: boolean
        default: false
      force_celery:
        description: "Force celery redeploy (even without task changes)"
        type: boolean
        default: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Smart Deploy
    runs-on: ubuntu-latest
    environment: Secret env

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2    # HEAD~1 is enough for change detection

      # ── 2. Detect what this push actually changed ──────────────────────────
      - name: Detect changed components
        id: changes
        run: |
          # First commit on a branch has no HEAD~1 — fall back to all files
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF=$(git diff --name-only HEAD~1 HEAD)
          else
            DIFF=$(git ls-files)
          fi
          printf "=== Changed files ===\n%s\n=====================\n" "$DIFF"

          # Migrations: any migration file that isn't __init__.py
          needs_migrate=false
          echo "$DIFF" | grep -qE "^backend/apps/.+/migrations/[^_]" && needs_migrate=true
          [[ "${{ inputs.force_migrate }}" == "true" ]]                && needs_migrate=true

          # Celery: tasks.py, poster_generators, or content migrations
          # (the celery worker reads/writes Content — content schema changes need restart)
          needs_celery=false
          echo "$DIFF" | grep -qE "^(backend/apps/content/tasks\.py|poster_generators/)" && needs_celery=true
          echo "$DIFF" | grep -qE "^backend/apps/content/migrations/[^_]"                && needs_celery=true
          [[ "${{ inputs.force_celery }}" == "true" ]]                                   && needs_celery=true

          echo "needs_migrate=$needs_migrate" | tee -a "$GITHUB_OUTPUT"
          echo "needs_celery=$needs_celery"   | tee -a "$GITHUB_OUTPUT"
          echo "::notice::migrate=$needs_migrate | celery=$needs_celery"

      # ── 3. AWS auth ────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build with layer cache ──────────────────────────────────────────
      # GHA cache preserves pip-install and apt layers across pushes.
      # On a typical push (requirements.txt unchanged) this saves ~60 seconds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          docker buildx build \
            --platform linux/amd64 \
            --file  backend/Dockerfile \
            --tag   "$IMAGE_URI" \
            --tag   "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest" \
            --cache-from "type=gha,scope=backend" \
            --cache-to   "type=gha,scope=backend,mode=max" \
            --push \
            .

      # ── 5. Patch web task definition (always needed) ───────────────────────
      # Inject the new image and strip read-only fields in one jq pass.
      # This file is reused by the migration step and the web deploy step.
      - name: Prepare web task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION_WEB }}" \
            --query taskDefinition \
          | jq --arg img "$IMAGE_URI" '
              .containerDefinitions[0].image = $img
              | del(.taskDefinitionArn, .revision, .status,
                    .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy)
            ' > /tmp/td-web.json

      # ── 6. Migrations (only when migration files changed) ──────────────────
      - name: Scale down celery before migrations
        if: steps.changes.outputs.needs_migrate == 'true'
        # Frees RAM on the t3.micro so the migration task can start
        # alongside the still-running web container.
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE_CELERY }}" \
            --desired-count 0
          aws ecs wait services-stable \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE_CELERY }}"

      - name: Run database migrations
        if: steps.changes.outputs.needs_migrate == 'true'
        run: |
          # Port-free task definition so it can co-exist with the web container
          jq '.containerDefinitions[0].portMappings = [] | .family = "edgedelivery-migrate"' \
            /tmp/td-web.json > /tmp/td-migrate.json

          MIGRATE_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td-migrate.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          RESULT=$(aws ecs run-task \
            --cluster         "${{ vars.ECS_CLUSTER }}" \
            --task-definition "$MIGRATE_ARN" \
            --launch-type     EC2 \
            --overrides "{
              \"containerOverrides\": [{
                \"name\":    \"${{ vars.CONTAINER_NAME }}\",
                \"command\": [\"python\",\"manage.py\",\"migrate\",\"--noinput\"]
              }]
            }")

          if [ "$(echo "$RESULT" | jq '.failures | length')" -gt 0 ]; then
            echo "$RESULT" | jq '.failures'
            exit 1
          fi

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn')
          aws ecs wait tasks-stopped \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks   "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks   "$TASK_ARN" \
            --query   'tasks[0].containers[0].exitCode' \
            --output  text)

          [ "$EXIT_CODE" != "0" ] && echo "Migrations failed (exit $EXIT_CODE)" && exit 1
          echo "Migrations completed"

      # ── 7. Deploy web (always) ─────────────────────────────────────────────
      - name: Deploy web service
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td-web.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster         "${{ vars.ECS_CLUSTER }}" \
            --service         "${{ vars.ECS_SERVICE_WEB }}" \
            --task-definition "$NEW_ARN"

          aws ecs wait services-stable \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE_WEB }}"

      # ── 8. Deploy celery (only when tasks or content schema changed) ────────
      - name: Deploy celery service
        if: steps.changes.outputs.needs_celery == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION_CELERY }}" \
            --query taskDefinition \
          | jq --arg img "$IMAGE_URI" '
              .containerDefinitions[0].image = $img
              | del(.taskDefinitionArn, .revision, .status,
                    .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy)
            ' > /tmp/td-celery.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td-celery.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          # --desired-count 1 also covers the case where celery was scaled
          # down for migrations but doesn't need a full redeploy
          aws ecs update-service \
            --cluster         "${{ vars.ECS_CLUSTER }}" \
            --service         "${{ vars.ECS_SERVICE_CELERY }}" \
            --task-definition "$NEW_ARN" \
            --desired-count   1

          aws ecs wait services-stable \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE_CELERY }}"

      # ── 9. Restore celery if it was scaled down but not redeployed ─────────
      # Fires when: migrations ran (celery was scaled to 0) but tasks didn't
      # change (celery deploy was skipped). We just need it running again.
      - name: Restore celery after migrations
        if: |
          always() &&
          steps.changes.outputs.needs_migrate == 'true' &&
          steps.changes.outputs.needs_celery  != 'true'
        run: |
          aws ecs update-service \
            --cluster       "${{ vars.ECS_CLUSTER }}" \
            --service       "${{ vars.ECS_SERVICE_CELERY }}" \
            --desired-count 1

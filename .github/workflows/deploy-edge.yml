name: Deploy Lambda@Edge

# Only runs when the geo-routing function itself changes.
# Lambda@Edge must be deployed in us-east-1 regardless of the S3/CF region.

on:
  push:
    branches: [main]
    paths:
      - 'edge/viewer-request.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Secret env

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (us-east-1 required for Lambda@Edge)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Zip Lambda function
        run: zip -j edge/viewer-request.zip edge/viewer-request.js

      - name: Create or update Lambda function
        id: lambda
        run: |
          FUNCTION_NAME="cloudfront-geo-manifest-router"

          if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://edge/viewer-request.zip
            aws lambda wait function-updated --function-name $FUNCTION_NAME
          else
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --runtime nodejs20.x \
              --role ${{ secrets.LAMBDA_EDGE_ROLE_ARN }} \
              --handler viewer-request.handler \
              --zip-file fileb://edge/viewer-request.zip
            aws lambda wait function-active --function-name $FUNCTION_NAME
          fi

          # Lambda@Edge requires a published version (not $LATEST)
          VERSION=$(aws lambda publish-version \
            --function-name $FUNCTION_NAME \
            --query 'Version' --output text)

          ARN=$(aws lambda get-function \
            --function-name $FUNCTION_NAME \
            --query 'Configuration.FunctionArn' --output text)

          echo "arn=${ARN}:${VERSION}" >> $GITHUB_OUTPUT
          echo "Published ${ARN}:${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install boto3
        run: pip install boto3 -q

      - name: Associate Lambda@Edge version with CloudFront distribution
        run: python3 edge/update_cloudfront.py
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          LAMBDA_ARN: ${{ steps.lambda.outputs.arn }}

      - name: Post summary
        run: |
          echo "## Lambda@Edge Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Function ARN** | \`${{ steps.lambda.outputs.arn }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Distribution** | \`${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | viewer-request |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u) |" >> $GITHUB_STEP_SUMMARY

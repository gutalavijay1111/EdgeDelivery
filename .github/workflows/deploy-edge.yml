name: Deploy CloudFront Function

# Runs only when the geo-routing function changes.
# CloudFront Functions are free tier and deploy globally in seconds —
# no IAM execution role or us-east-1 requirement like Lambda@Edge.

on:
  push:
    branches: [main]
    paths:
      - 'edge/cf-function.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Secret env

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create or update CloudFront Function
        id: fn
        run: |
          NAME="geo-manifest-router"

          if aws cloudfront describe-function --name $NAME 2>/dev/null; then
            ETAG=$(aws cloudfront describe-function --name $NAME --query 'ETag' --output text)
            aws cloudfront update-function \
              --name $NAME \
              --function-config Comment="Routes manifest.json to regional file by viewer country",Runtime=cloudfront-js-2.0 \
              --function-code fileb://edge/cf-function.js \
              --if-match $ETAG
          else
            aws cloudfront create-function \
              --name $NAME \
              --function-config Comment="Routes manifest.json to regional file by viewer country",Runtime=cloudfront-js-2.0 \
              --function-code fileb://edge/cf-function.js
          fi

          ETAG=$(aws cloudfront describe-function --name $NAME --query 'ETag' --output text)
          ARN=$(aws cloudfront publish-function --name $NAME --if-match $ETAG \
            --query 'FunctionSummary.FunctionMetadata.FunctionARN' --output text)

          echo "arn=$ARN" >> $GITHUB_OUTPUT
          echo "Published: $ARN"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install boto3
        run: pip install boto3 -q

      - name: Associate function with CloudFront distribution
        run: python3 edge/update_cloudfront.py
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          FUNCTION_ARN: ${{ steps.fn.outputs.arn }}

      - name: Summary
        run: |
          echo "## CloudFront Function Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Function ARN** | \`${{ steps.fn.outputs.arn }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | viewer-request |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runtime** | cloudfront-js-2.0 (free tier) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u) |" >> $GITHUB_STEP_SUMMARY

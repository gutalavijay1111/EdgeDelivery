name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Secret env

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate manifests for all regions
        run: python3 generate_manifest.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync regional image folders to S3
        run: |
          for region in data/*/; do
            region=$(basename "$region")
            aws s3 sync data/$region/ s3://${{ secrets.S3_BUCKET }}/data/$region/ \
              --cache-control "public,max-age=31536000,immutable" \
              --delete
          done

      - name: Upload index.html
        run: |
          aws s3 cp index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Upload all regional manifests
        run: |
          for region in data/*/; do
            region=$(basename "$region")
            aws s3 cp manifest-$region.json s3://${{ secrets.S3_BUCKET }}/manifest-$region.json \
              --cache-control "no-cache"
          done
          aws s3 cp manifest.json s3://${{ secrets.S3_BUCKET }}/manifest.json \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          PATHS="/index.html /manifest.json"
          for region in data/*/; do
            region=$(basename "$region")
            PATHS="$PATHS /manifest-$region.json"
          done
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths $PATHS

      - name: Smoke test — verify cache headers and post deploy summary
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' --output text)

          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://$CF_DOMAIN |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cache headers — manifest.json (first hit after invalidation)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sI "https://$CF_DOMAIN/manifest.json" \
            | grep -iE "x-cache|x-amz-cf-pop|age|cache-control" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

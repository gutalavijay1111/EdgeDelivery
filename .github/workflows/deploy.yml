name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Secret env

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install boto3
        run: pip install boto3 -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate manifests (reads from S3)
        run: python3 generate_manifest.py
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Upload all regional manifests
        run: |
          for region in JP US IN NL; do
            aws s3 cp manifest-$region.json s3://${{ secrets.S3_BUCKET }}/manifest-$region.json \
              --cache-control "no-cache"
          done
          aws s3 cp manifest.json s3://${{ secrets.S3_BUCKET }}/manifest.json \
            --cache-control "no-cache"

      - name: Deploy upload Lambda
        run: |
          cd lambda
          zip -q function.zip upload_handler.py

          # Update code if function exists, otherwise create it
          if aws lambda get-function --function-name edge-upload 2>/dev/null; then
            aws lambda update-function-code \
              --function-name edge-upload \
              --zip-file fileb://function.zip
            aws lambda update-function-configuration \
              --function-name edge-upload \
              --environment "Variables={S3_BUCKET=${{ secrets.S3_BUCKET }},CLOUDFRONT_DISTRIBUTION_ID=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}}"
          else
            aws lambda create-function \
              --function-name edge-upload \
              --runtime python3.12 \
              --handler upload_handler.handler \
              --zip-file fileb://function.zip \
              --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
              --environment "Variables={S3_BUCKET=${{ secrets.S3_BUCKET }},CLOUDFRONT_DISTRIBUTION_ID=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}}"

          fi

          # Ensure Function URL exists (idempotent — handles partial prior runs)
          if ! aws lambda get-function-url-config --function-name edge-upload 2>/dev/null; then
            aws lambda add-permission \
              --function-name edge-upload \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE 2>/dev/null || true

            aws lambda create-function-url-config \
              --function-name edge-upload \
              --auth-type NONE \
              --cors '{"AllowOrigins":["*"],"AllowMethods":["GET","POST"],"AllowHeaders":["Content-Type"]}'
          fi

          LAMBDA_URL=$(aws lambda get-function-url-config \
            --function-name edge-upload \
            --query 'FunctionUrl' --output text)
          echo "LAMBDA_URL=$LAMBDA_URL" >> $GITHUB_ENV
          echo "Lambda URL: $LAMBDA_URL"

      - name: Upload index.html (with live Lambda URL injected)
        run: |
          sed "s|var UPLOAD_ENDPOINT = '.*';|var UPLOAD_ENDPOINT = '$LAMBDA_URL';|" \
            index.html > index.html.deploy
          aws s3 cp index.html.deploy s3://${{ secrets.S3_BUCKET }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/manifest.json" "/manifest-JP.json" "/manifest-US.json" "/manifest-IN.json" "/manifest-NL.json"

      - name: Smoke test — verify cache headers and post deploy summary
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' --output text)

          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://$CF_DOMAIN |" >> $GITHUB_STEP_SUMMARY
          echo "| **Upload endpoint** | \`$LAMBDA_URL\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cache headers — manifest.json (first hit after invalidation)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sI "https://$CF_DOMAIN/manifest.json" \
            | grep -iE "x-cache|x-amz-cf-pop|age|cache-control" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

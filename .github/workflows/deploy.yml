name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate manifest.json
        run: python3 generate_manifest.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync images to S3
        run: |
          aws s3 sync data/ s3://${{ secrets.S3_BUCKET }}/data/ --delete

      - name: Upload index.html
        run: aws s3 cp index.html s3://${{ secrets.S3_BUCKET }}/index.html

      - name: Upload manifest.json
        run: aws s3 cp manifest.json s3://${{ secrets.S3_BUCKET }}/manifest.json

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

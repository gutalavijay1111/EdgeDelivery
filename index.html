<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeDelivery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">

<style>

/* ── Tokens ── */

:root{
    --bg:           #fffdf2;
    --bg-card:      #ffffff;
    --bg-inspector: #F1E4DE;
    --bg-modal:     #fffdf2;
    --bg-btn:       #F1E4DE;
    --bg-country:   #F1E4DE;

    --border:       #e8d8d0;
    --border-card:  #ede0d8;

    --text:         #242523;
    --text-muted:   #9a8f87;
    --text-label:   #b0a098;
    --text-val:     #4a4240;

    --amber:        #dda15e;
    --amber-dim:    rgba(221,161,94,0.15);
    --amber-border: rgba(221,161,94,0.35);
    --amber-dark:   #b8782a;

    --purple:       #9D8DF1;

    --hit:          #5a8a50;
    --miss:         #c0622a;

    --shadow:       0 2px 8px rgba(36,37,35,0.07), 0 8px 24px rgba(36,37,35,0.05);
    --shadow-lg:    0 12px 40px rgba(36,37,35,0.15);
}

[data-theme="dark"]{
    --bg:           #1c1a16;
    --bg-card:      #1e1c18;
    --bg-inspector: #161410;
    --bg-modal:     #211f1b;
    --bg-btn:       #2a2720;
    --bg-country:   #18160f;

    --border:       #352f26;
    --border-card:  #2e2820;

    --text:         #fffdf2;
    --text-muted:   #6b6358;
    --text-label:   #524d44;
    --text-val:     #9e9080;

    --amber:        #dda15e;
    --amber-dim:    rgba(221,161,94,0.1);
    --amber-border: rgba(221,161,94,0.22);
    --amber-dark:   #dda15e;

    --hit:          #7ab870;
    --miss:         #e8845a;

    --shadow:       none;
    --shadow-lg:    0 24px 60px rgba(0,0,0,0.55);
}

/* ── Reset ── */

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
    overflow-x: hidden;
}

/* ── Modal ── */

.modal-bg{
    position: fixed;
    inset: 0;
    background: rgba(36,37,35,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    backdrop-filter: blur(8px);
}

.modal-bg.hidden{ display: none; }

.modal{
    background: var(--bg-modal);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 44px 40px 40px;
    width: 480px;
    max-width: 94vw;
    box-shadow: var(--shadow-lg);
}

.modal-eyebrow{
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 6px;
}

.modal h2{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 28px;
}

.country-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.country-btn{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--bg-country);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    text-align: left;
    color: inherit;
    font-family: inherit;
    position: relative;
    overflow: hidden;
}

.country-btn::after{
    content: '';
    position: absolute;
    inset: 0;
    background: var(--amber);
    opacity: 0;
    transition: opacity 0.15s;
    border-radius: inherit;
}

.country-btn:hover{
    border-color: var(--amber);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--amber-dim);
}

.country-btn.global{ grid-column: 1 / -1; }

.flag{ font-size: 2rem; line-height: 1; position: relative; z-index: 1; }
.country-btn .info{ display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 1; }
.country-btn .name{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    color: var(--text);
    line-height: 1;
}
.country-btn .code{
    font-size: 0.65rem;
    color: var(--text-muted);
    font-family: monospace;
    letter-spacing: 0.08em;
}

/* ── Top bar ── */

.topbar{
    background: var(--bg-inspector);
    border-bottom: 1px solid var(--border);
    padding: 9px 36px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-family: monospace;
    font-size: 0.7rem;
    overflow-x: auto;
    scrollbar-width: none;
}

.topbar::-webkit-scrollbar{ display: none; }

.inspector-item{ display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.inspector-item .label{
    color: var(--text-label);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.58rem;
}
.inspector-item .val{ color: var(--text-val); }
.val.hit  { color: var(--hit);  font-weight: 700; }
.val.miss { color: var(--miss); font-weight: 700; }
.sep{ width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }
.spacer{ flex: 1; min-width: 16px; }

.theme-toggle{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    background: var(--bg-btn);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
    flex-shrink: 0;
}

.theme-toggle:hover{ border-color: var(--amber); color: var(--text); }

/* ── Hero ── */

.hero{
    padding: 52px 36px 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
}

.hero-left{ min-width: 0; }

.hero-eyebrow{
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 4px;
}

.hero-title{
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 10vw, 8rem);
    line-height: 0.92;
    letter-spacing: 0.01em;
    color: var(--text);

}

.hero-title .accent{ color: var(--amber); }

.hero-meta{
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.region-badge{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    background: var(--amber-dim);
    border: 1px solid var(--amber-border);
    border-radius: 100px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--amber-dark);
}

.meta-text{
    font-size: 0.78rem;
    color: var(--text-muted);
}

.hero-right{
    padding-bottom: 4px;
}

.change-btn{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: transparent;
    border: 2px solid var(--border);
    border-radius: 100px;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, transform 0.15s;
    white-space: nowrap;
}

.change-btn:hover{
    border-color: var(--amber);
    color: var(--amber-dark);
    transform: translateY(-1px);
}

/* ── Divider ── */

.hero-divider{
    height: 1px;
    background: var(--border);
    margin: 28px 36px 0;
}

/* ── Carousel ── */

.row{ padding: 32px 0 4px; }

.row-header{
    padding: 0 36px 16px;
    display: flex;
    align-items: baseline;
    gap: 12px;
}

.row-title{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.03em;
    color: var(--text);
    line-height: 1;
}

.row-count{
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 500;
}

.track{
    display: flex;
    flex-wrap: nowrap;
    gap: 14px;
    overflow-x: auto;
    padding: 6px 36px 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--amber) transparent;
}

.track::-webkit-scrollbar{ height: 3px; }
.track::-webkit-scrollbar-thumb{ background: var(--amber); border-radius: 2px; }

.card{
    flex: 0 0 240px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
    transform-origin: bottom center;
}

.card:hover{
    transform: scale(1.06) translateY(-6px) rotate(-0.8deg);
    box-shadow: var(--shadow-lg);
    border-color: var(--amber);
}

.card:nth-child(even):hover{
    transform: scale(1.06) translateY(-6px) rotate(0.8deg);
}

.card img{ width: 100%; height: 160px; object-fit: cover; display: block; }

.card-label{
    padding: 10px 12px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ── States ── */

.empty{
    padding: 16px 36px 32px;
    color: var(--text-muted);
    font-size: 0.85rem;
}

.loading{
    padding: 80px 36px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.06em;
    color: var(--border);
}

.error-block{
    margin: 32px 36px;
    padding: 28px;
    background: var(--amber-dim);
    border: 1px solid var(--amber-border);
    border-radius: 14px;
    font-size: 0.83rem;
    color: var(--text);
}

.error-block code{
    font-size: 0.78rem;
    color: var(--amber-dark);
}

</style>
</head>
<body>

<!-- Country Picker Modal -->
<div class="modal-bg" id="modal-bg">
    <div class="modal">
        <p class="modal-eyebrow">EdgeDelivery</p>
        <h2>Where are<br>you from?</h2>
        <div class="country-grid">
            <button class="country-btn" data-code="JP">
                <span class="flag">&#127471;&#127477;</span>
                <span class="info"><span class="name">Japan</span><span class="code">JP</span></span>
            </button>
            <button class="country-btn" data-code="US">
                <span class="flag">&#127482;&#127480;</span>
                <span class="info"><span class="name">United States</span><span class="code">US</span></span>
            </button>
            <button class="country-btn" data-code="IN">
                <span class="flag">&#127470;&#127475;</span>
                <span class="info"><span class="name">India</span><span class="code">IN</span></span>
            </button>
            <button class="country-btn" data-code="NL">
                <span class="flag">&#127475;&#127473;</span>
                <span class="info"><span class="name">Netherlands</span><span class="code">NL &middot; VPN test</span></span>
            </button>
            <button class="country-btn global" data-code="GLOBAL">
                <span class="flag">&#127758;</span>
                <span class="info"><span class="name">Global</span><span class="code">All regions</span></span>
            </button>
        </div>
    </div>
</div>

<!-- Top bar -->
<div class="topbar">
    <div class="inspector-item">
        <span class="label">Manifest</span>
        <span class="val" id="i-file">—</span>
    </div>
    <div class="sep"></div>
    <div class="inspector-item">
        <span class="label">X-Cache</span>
        <span class="val" id="i-cache">—</span>
    </div>
    <div class="sep"></div>
    <div class="inspector-item">
        <span class="label">Edge PoP</span>
        <span class="val" id="i-pop">—</span>
    </div>
    <div class="sep"></div>
    <div class="inspector-item">
        <span class="label">Age</span>
        <span class="val" id="i-age">—</span>
    </div>
    <div class="sep"></div>
    <div class="inspector-item">
        <span class="label">Cache-Control</span>
        <span class="val" id="i-cc">—</span>
    </div>
    <div class="spacer"></div>
    <button class="theme-toggle" id="theme-toggle">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Dark</span>
    </button>
</div>

<!-- Hero (injected by JS) -->
<div id="hero">
    <div class="hero">
        <div class="hero-left">
            <p class="hero-eyebrow">Content Delivery Network</p>
            <h1 class="hero-title">EDGE<br><span class="accent">DELIVERY</span></h1>
        </div>
    </div>
    <div class="hero-divider"></div>
</div>

<!-- Carousel rows -->
<div id="content">
    <div class="loading">Loading...</div>
</div>

<script>

var REGIONS = {
    JP:     { name: 'Japan',         flag: '🇯🇵', manifest: 'manifest-JP.json' },
    US:     { name: 'United States', flag: '🇺🇸', manifest: 'manifest-US.json' },
    IN:     { name: 'India',         flag: '🇮🇳', manifest: 'manifest-IN.json' },
    NL:     { name: 'Netherlands',   flag: '🇳🇱', manifest: 'manifest-NL.json' },
    GLOBAL: { name: 'Global',        flag: '🌎',  manifest: 'manifest.json'    }
};

var REGION_KEY = 'edge-region';
var THEME_KEY  = 'edge-theme';

/* ── Theme ── */

function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme-icon').textContent  = t === 'dark' ? '☀️' : '🌙';
    document.getElementById('theme-label').textContent = t === 'dark' ? 'Light' : 'Dark';
    localStorage.setItem(THEME_KEY, t);
}

document.getElementById('theme-toggle').addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

applyTheme(localStorage.getItem(THEME_KEY) || 'light');

/* ── Modal ── */

function openModal(){  document.getElementById('modal-bg').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal-bg').classList.add('hidden'); }

document.querySelectorAll('.country-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
        var code = btn.getAttribute('data-code');
        localStorage.setItem(REGION_KEY, code);
        closeModal();
        loadGallery(code);
    });
});

/* ── Gallery ── */

async function loadGallery(code){

    var region = REGIONS[code] || REGIONS.GLOBAL;
    var url    = region.manifest;

    document.getElementById('content').innerHTML = '<div class="loading">Loading...</div>';

    try{
        var res      = await fetch(url);
        var manifest = await res.json();

        /* inspector */
        var xCache = res.headers.get('x-cache')       || 'local';
        var pop    = res.headers.get('x-amz-cf-pop')  || 'local';
        var age    = res.headers.get('age');
        var cc     = res.headers.get('cache-control') || '—';

        document.getElementById('i-file').textContent = url;
        document.getElementById('i-pop').textContent  = pop;
        document.getElementById('i-age').textContent  = age ? age + 's' : 'fresh';
        document.getElementById('i-cc').textContent   = cc;

        var cacheEl = document.getElementById('i-cache');
        cacheEl.textContent = xCache;
        cacheEl.className   = 'val';
        if(xCache.toLowerCase().includes('hit'))       cacheEl.classList.add('hit');
        else if(xCache.toLowerCase().includes('miss')) cacheEl.classList.add('miss');

        /* hero */
        var trendLine = code === 'GLOBAL' ? 'ALL&nbsp;REGIONS' : 'TRENDING&nbsp;IN&nbsp;' + region.name.toUpperCase();
        document.getElementById('hero').innerHTML =
            '<div class="hero">' +
            '<div class="hero-left">' +
            '<p class="hero-eyebrow">Content Delivery Network</p>' +
            '<h1 class="hero-title">EDGE<br><span class="accent">DELIVERY</span></h1>' +
            '<div class="hero-meta">' +
            '<span class="region-badge">' + region.flag + '&nbsp;' + region.name + '</span>' +
            '<span class="meta-text">' + manifest.images.length + ' images &middot; ' +
            new Date(manifest.generated_at).toUTCString() + '</span>' +
            '</div>' +
            '</div>' +
            '<div class="hero-right">' +
            '<button class="change-btn" id="change-btn">&#127757; Change Region</button>' +
            '</div>' +
            '</div>' +
            '<div class="hero-divider"></div>';

        document.getElementById('change-btn').addEventListener('click', openModal);

        /* carousel */
        var content = document.getElementById('content');
        content.innerHTML = '';

        if(!manifest.images.length){
            content.innerHTML =
                '<p class="empty">No images yet — drop files into data/' +
                (code === 'GLOBAL' ? '' : code + '/') + ' and redeploy.</p>';
            return;
        }

        var row = document.createElement('div');
        row.className = 'row';

        var header = document.createElement('div');
        header.className = 'row-header';
        header.innerHTML =
            '<span class="row-title">' + trendLine + '</span>' +
            '<span class="row-count">' + manifest.images.length + ' titles</span>';

        var track = document.createElement('div');
        track.className = 'track';

        manifest.images.forEach(function(src){
            var name = src.split('/').pop();
            var card = document.createElement('div');
            card.className = 'card';
            card.innerHTML =
                '<img loading="lazy" src="' + src + '" alt="' + name + '">' +
                '<div class="card-label">' + name + '</div>';
            track.appendChild(card);
        });

        row.appendChild(header);
        row.appendChild(track);
        content.appendChild(row);

    } catch(err){
        document.getElementById('content').innerHTML =
            '<div class="error-block">' +
            'Failed to load <code>' + url + '</code><br><br>' +
            'Local dev: <code>python3 generate_manifest.py &amp;&amp; python3 -m http.server 8000</code>' +
            '</div>';
        console.error(err);
    }
}

/* ── Init ── */

var saved = localStorage.getItem(REGION_KEY);
if(saved && REGIONS[saved]){
    closeModal();
    loadGallery(saved);
} else {
    openModal();
}

</script>
</body>
</html>

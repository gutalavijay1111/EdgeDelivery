<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CloudFront Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:system-ui;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.stats{
    text-align:center;
    margin-bottom:30px;
    color:#94a3b8;
}

.gallery{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(300px,1fr));

    gap:20px;
}

.card{

    overflow:hidden;

    border-radius:16px;

    background:#111827;

    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{

    width:100%;
    height:250px;

    object-fit:cover;

    display:block;
}

.filename{

    padding:12px;
    font-size:.9rem;

    color:#cbd5e1;
}

.loader{
    text-align:center;
    padding:60px;
}

</style>

</head>
<body>

<h1>📸 CloudFront Image Gallery</h1>

<div class="stats" id="stats">
Loading...
</div>

<div class="gallery" id="gallery"></div>

<script>

async function loadGallery(){

    try{

        const response =
            await fetch("manifest.json");

        const manifest =
            await response.json();

        document.getElementById("stats")
            .innerText =
            `${manifest.images.length} images • Generated ${manifest.generated_at}`;

        const gallery =
            document.getElementById("gallery");

        manifest.images.forEach(image => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <img loading="lazy" src="${image}">
                <div class="filename">${image}</div>
            `;

            gallery.appendChild(card);

        });

    }
    catch(error){

        document.getElementById("stats")
            .innerText =
            "Failed to load gallery.";

        console.error(error);
    }
}

loadGallery();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CloudFront Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:system-ui;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.gallery{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(300px,1fr));

    gap:20px;
}

.card{

    overflow:hidden;

    border-radius:16px;

    background:#111827;

    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{

    width:100%;
    height:250px;

    object-fit:cover;

    display:block;
}

.filename{

    padding:12px;
    font-size:.9rem;

    color:#cbd5e1;
}

</style>

</head>
<body>

<h1>CloudFront Image Gallery</h1>

<div class="gallery" id="gallery">
    <p style="color:#94a3b8;padding:60px;text-align:center">No images loaded.</p>
</div>

</body>
</html>
